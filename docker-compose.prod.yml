# ── Production Docker Compose ─────────────────────────────────────────
#
# Default: the app on PORT, no TLS.
#   HOST_SECRETS_DIR=/path/to/secrets docker compose -f docker-compose.prod.yml up
#
# With TLS: the "tls" profile starts Caddy for DOMAIN.
#   HOST_SECRETS_DIR=/path/to/secrets DOMAIN=sigint.example.com docker compose -f docker-compose.prod.yml --profile tls up

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "${PORT:-5500}:${PORT:-5500}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5500}
    restart: always
    command: bun src/server/index.prod.ts
    user: "710:710"
    read_only: true
    volumes:
      - ${HOST_SECRETS_DIR:?set HOST_SECRETS_DIR}:/run/secrets:ro
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 256
    ulimits:
      nofile: 4096
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "const port = process.env.PORT; const res = await fetch('http://localhost:' + port); process.exit(res.ok ? 0 : 1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:alpine
    profiles:
      - tls
    ports:
      - "443:443"
      - "80:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - PORT=${PORT:-5500}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

volumes:
  caddy_data:
  caddy_config:
