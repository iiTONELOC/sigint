services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - PORT=5500
      - CYCLONES_FIXTURE=${CYCLONES_FIXTURE:-}
      - AIRCRAFT_FIXTURE=${AIRCRAFT_FIXTURE:-}
    ports:
      - "5501:5500"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./tests:/app/tests
    command: bun --hot src/server/index.ts
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "const res = await fetch('http://localhost:5500'); process.exit(res.ok ? 0 : 1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy-dev
    image: sigint-caddy-dev:2.11.7
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PORT=${PORT:-5500}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
